# Template for one Blue/Green slot.
# The pipeline replaces __COLOR__, __IMAGE__ and __VERSION__ before applying.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app-__COLOR__
  namespace: demo
  labels:
    app: demo-app
    color: __COLOR__
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-app
      color: __COLOR__
  template:
    metadata:
      labels:
        app: demo-app
        color: __COLOR__
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: app
          image: __IMAGE__
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: APP_VERSION
              value: "__VERSION__"
            - name: DEPLOY_COLOR
              value: "__COLOR__"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
