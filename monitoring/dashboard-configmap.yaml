apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-app-dashboard
  namespace: monitoring
data:
  demo-app.json: |
    {
      "title": "Demo App - Golden Signals",
      "uid": "demo-app",
      "schemaVersion": 39,
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "type": "timeseries",
          "title": "Requests per second (by pod)",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "targets": [{ "expr": "sum by (pod) (rate(http_requests_total{namespace=\"demo\"}[1m]))" }]
        },
        {
          "type": "timeseries",
          "title": "p95 latency (s)",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "targets": [{ "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"demo\"}[5m])))" }]
        },
        {
          "type": "timeseries",
          "title": "5xx error rate",
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "targets": [{ "expr": "sum(rate(http_requests_total{namespace=\"demo\",status=~\"5..\"}[5m])) / sum(rate(http_requests_total{namespace=\"demo\"}[5m]))" }]
        },
        {
          "type": "timeseries",
          "title": "Memory per pod (bytes)",
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "targets": [{ "expr": "process_resident_memory_bytes{namespace=\"demo\"}" }]
        }
      ]
    }
